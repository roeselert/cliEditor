[project]
name = "cli-editor"
version = "0.1.0"
description = "A terminal code editor built with Textual"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual[syntax]>=0.80",
    # tree-sitter 0.26 segfaults with the JavaScript grammar in some runs.
    "tree-sitter==0.25.2",
    "tree-sitter-javascript==0.25.0",
    "platformdirs>=4",
]

[project.scripts]
cliEditor = "cli_editor.app:main"

[dependency-groups]
dev = [
    "textual-dev>=1.7",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-textual-snapshot>=1.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli_editor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Textual widgets declare BINDINGS as a class-level list by design.
ignore = ["RUF012"]
